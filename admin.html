<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Administration — MlnPods</title><style>
:root{--bg:#050505;--gold:#ffd21c;--panel:#111;--line:#292929;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{width:min(760px,94%);margin:24px auto 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:15px 0;margin-bottom:22px}.brand{font-weight:900;letter-spacing:2px;color:var(--gold)}a{color:var(--gold);text-decoration:none}.panel,.product{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.hidden{display:none!important}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px;color:var(--gold)}p{color:var(--muted);line-height:1.5}.pin{display:flex;gap:9px;margin:18px 0}.pin input{max-width:220px;text-align:center;letter-spacing:8px;font-size:24px}input,select{background:#080808;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;font-size:16px;width:100%;min-width:0}label{display:block;font-size:13px;color:#ccc;margin:12px 0 6px}.btn{border:0;border-radius:10px;background:var(--gold);color:#080808;font-weight:900;padding:13px 17px;font-size:15px;cursor:pointer}.btn.secondary{background:#252525;color:#fff;border:1px solid #444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-size:12px;font-weight:bold;color:#9be6ad}.status.off{color:#ff9b9b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hint{font-size:12px;color:#888}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{margin-top:12px}.panel,.product{padding:14px}}
</style></head><body><div class="wrap"><header><div class="brand">MLN PODS · ADMIN</div><a href="index.html">← Voir le site</a></header>
<section id="login" class="panel"><h1>Connexion administrateur</h1><p>Entre ton code PIN à 4 chiffres pour gérer la boutique.</p><div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"><button class="btn" id="loginBtn">Entrer</button></div><p id="loginError" class="hint"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="product-head"><div><h1>Tableau de bord</h1><p>Gère tes stocks, tes restocks et tes prix. Les changements sont synchronisés pour tous les visiteurs.</p></div><button class="btn secondary" id="logout">Déconnexion</button></div></div><div id="products"><p>Chargement des produits…</p></div><div class="panel"><button class="btn" id="saveAll">Enregistrer les modifications</button> <span id="saved" class="hint"></span></div></section></div>
<script src="mlnpods-sync.js"></script><script>
const PIN='2610';const $=id=>document.getElementById(id);let data=[];
async function login(){if($('pin').value===PIN){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('loginError').textContent='';await load();}else{$('loginError').textContent='Code incorrect. Réessaie.';$('pin').value='';}}
$('loginBtn').onclick=login;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value='';};
async function load(){try{data=await window.MlnPodsSync.request('products?select=*&order=name.asc');render();}catch(e){$('products').innerHTML='<p>Impossible de charger les produits. Vérifie la configuration Supabase.</p>';console.error(e);}}
function render(){$('products').innerHTML='';data.forEach(p=>{let el=document.createElement('section');el.className='product';el.innerHTML=`<div class="product-head"><h2>${p.name}</h2><span class="status ${p.in_stock?'':'off'}">${p.in_stock?'EN STOCK':'RUPTURE'}</span></div><div class="grid"><div><label>Quantité en stock</label><input type="number" min="0" step="1" data-id="${p.id}" data-f="stock_quantity" value="${p.stock_quantity}"></div><div><label>Disponibilité</label><select data-id="${p.id}" data-f="in_stock"><option value="true" ${p.in_stock?'selected':''}>En stock</option><option value="false" ${!p.in_stock?'selected':''}>Rupture de stock</option></select></div><div><label>Prix actuel (€)</label><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="price" value="${p.price}"></div><div><label>Ancien prix (€)</label><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="old_price" value="${p.old_price??''}"></div><div><label>Promotion</label><select data-id="${p.id}" data-f="promo_enabled"><option value="true" ${p.promo_enabled?'selected':''}>Activée</option><option value="false" ${!p.promo_enabled?'selected':''}>Désactivée</option></select></div><div><label>Date et heure du prochain restock</label><input type="datetime-local" data-id="${p.id}" data-f="restock_at" value="${p.restock_at?new Date(new Date(p.restock_at).getTime()-new Date(p.restock_at).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div></div><div class="actions"><button class="btn secondary" data-clear="${p.id}">Effacer le restock</button></div>`;$('products').appendChild(el);});document.querySelectorAll('#products input,#products select').forEach(el=>el.addEventListener('change',()=>{let p=data.find(x=>x.id===el.dataset.id),f=el.dataset.f,v=el.value;if(f==='stock_quantity'||f==='price'||f==='old_price')v=v===''?null:Number(v);if(f==='in_stock'||f==='promo_enabled')v=v==='true';if(f==='restock_at')v=v?new Date(v).toISOString():null;p[f]=v;if(f==='stock_quantity'&&v===0)p.in_stock=false;let status=el.closest('.product').querySelector('.status');status.textContent=p.in_stock?'EN STOCK':'RUPTURE';status.classList.toggle('off',!p.in_stock);}));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{let p=data.find(x=>x.id===b.dataset.clear);p.restock_at=null;b.closest('.product').querySelector('[data-f="restock_at"]').value='';});}
$('saveAll').onclick=async()=>{let btn=$('saveAll');btn.disabled=true;try{for(const p of data){await window.MlnPodsSync.request('products?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({name:p.name,price:p.price,old_price:p.old_price,promo_enabled:p.promo_enabled,stock_quantity:p.stock_quantity,in_stock:p.in_stock,restock_at:p.restock_at,updated_at:new Date().toISOString()})});}$('saved').textContent='✓ Modifications enregistrées et synchronisées';}catch(e){$('saved').textContent='Erreur : '+e.message;console.error(e);}finally{btn.disabled=false;}};
</script></body></html>
