<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Administration</title>
<style>
:root{--bg:#070707;--gold:#ffd21c;--gold2:#f2b900;--panel:#111;--panel2:#171717;--line:#303030;--muted:#aaa;--green:#9be6ad;--red:#ff9b9b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#25200c 0,transparent 42%),var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{width:min(780px,94%);margin:0 auto 56px;padding:22px 0 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:4px 0 20px;margin-bottom:24px}
.brand{display:flex;align-items:center;min-width:0}.brand img{display:block;width:clamp(100px,25vw,150px);height:70px;object-fit:contain;object-position:left center}
.admin-tag{font-size:12px;letter-spacing:2.5px;font-weight:900;color:var(--gold);border-left:1px solid #51451a;padding:10px 0 10px 14px;margin-left:12px;white-space:nowrap}
a{color:var(--gold);text-decoration:none;font-weight:700;white-space:nowrap}
a:hover{color:#fff}
.panel,.product{background:linear-gradient(145deg,#151515,#0f0f0f);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 12px 32px #0006}
.hidden{display:none!important}
h1{font-size:clamp(25px,6vw,32px);margin:0 0 10px;letter-spacing:-.5px}
h2{font-size:19px;margin:0;color:var(--gold)}
p{color:var(--muted);line-height:1.55;margin:8px 0}
.pin{display:flex;gap:10px;margin:22px 0 10px;align-items:stretch}
.pin input{max-width:230px;text-align:center;letter-spacing:10px;font-size:25px;font-weight:800}
input,select{background:#090909;color:#fff;border:1px solid #484848;border-radius:12px;padding:13px;font-size:16px;width:100%;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #ffd21c22}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;color:#c9c9c9;margin:13px 0 7px}
.btn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#090909;font-weight:900;padding:14px 18px;font-size:15px;cursor:pointer;box-shadow:0 5px 16px #ffd21c22}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.55;cursor:wait}
.btn.secondary{background:#242424;color:#fff;border:1px solid #484848;box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.product{padding:20px}.product-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.status{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--green);background:#12351f;padding:7px 10px;border-radius:30px;white-space:nowrap}.status.off{color:var(--red);background:#3a1515}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hint{font-size:12px;color:#888}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.dashboard-intro{display:flex;justify-content:space-between;align-items:center;gap:18px}.dashboard-intro p{max-width:490px}.savebar{position:sticky;bottom:12px;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#171717ed;backdrop-filter:blur(12px);border:1px solid #444;border-radius:16px;padding:12px;box-shadow:0 10px 30px #0009}.savebar .btn{flex:0 0 auto}.savebar .hint{flex:1;min-width:150px}
@media(max-width:520px){.wrap{margin-top:8px}.panel,.product{padding:17px;border-radius:17px}.grid{grid-template-columns:1fr 1fr;gap:4px 10px}.dashboard-intro{align-items:flex-start;flex-direction:column}.dashboard-intro .btn{width:100%}.pin input{max-width:none}.pin{flex-direction:column}.pin .btn{width:100%}.brand img{width:100px;height:58px}.admin-tag{font-size:10px;letter-spacing:1.5px;padding-left:9px;margin-left:7px}header{align-items:center}.savebar{bottom:8px}.savebar .btn{width:100%}}
@media(max-width:360px){.grid{grid-template-columns:1fr}header{gap:8px}a{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><img src="mlnpods-intro-logo.png" alt="Logo boutique"><span class="admin-tag">ADMINISTRATION</span></div>
  <a href="index.html">← Voir le site</a>
</header>
<section id="login" class="panel">
  <h1>Connexion administrateur</h1>
  <p>Entre ton code PIN à 4 chiffres pour gérer la boutique.</p>
  <div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"><button class="btn" id="loginBtn">Accéder à l'administration</button></div>
  <p id="loginError" class="hint"></p>
</section>
<section id="dashboard" class="hidden">
  <div class="panel"><div class="dashboard-intro"><div><h1>Tableau de bord</h1><p>Gère tes stocks, tes restocks et tes prix. Les changements sont synchronisés pour tous les visiteurs.</p></div><button class="btn secondary" id="logout">Déconnexion</button></div></div>
  <div id="products"><p>Chargement des produits…</p></div>
  <div class="savebar"><button class="btn" id="saveAll">Enregistrer les modifications</button><span id="saved" class="hint"></span></div>
</section>
</div>
<script src="mlnpods-sync.js"></script>
<script>
const PIN='2610';const $=id=>document.getElementById(id);let data=[];
async function login(){if($('pin').value===PIN){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('loginError').textContent='';await load();}else{$('loginError').textContent='Code incorrect. Réessaie.';$('pin').value='';}}
$('loginBtn').onclick=login;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value='';};
async function load(){try{data=await window.MlnPodsSync.request('products?select=*&order=name.asc');render();}catch(e){$('products').innerHTML='<p>Impossible de charger les produits. Vérifie la configuration Supabase.</p>';console.error(e);}}
function render(){$('products').innerHTML='';data.forEach(p=>{let el=document.createElement('section');el.className='product';el.innerHTML=`<div class="product-head"><h2>${p.name}</h2><span class="status ${p.in_stock?'':'off'}">${p.in_stock?'EN STOCK':'RUPTURE'}</span></div><div class="grid"><div><label>Quantité en stock</label><input type="number" min="0" step="1" data-id="${p.id}" data-f="stock_quantity" value="${p.stock_quantity}"></div><div><label>Disponibilité</label><select data-id="${p.id}" data-f="in_stock"><option value="true" ${p.in_stock?'selected':''}>En stock</option><option value="false" ${!p.in_stock?'selected':''}>Rupture de stock</option></select></div><div><label>Prix actuel (€)</label><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="price" value="${p.price}"></div><div><label>Ancien prix (€)</label><input type="number" min="0" step="0.01" data-id="${p.id}" data-f="old_price" value="${p.old_price??''}"></div><div><label>Promotion</label><select data-id="${p.id}" data-f="promo_enabled"><option value="true" ${p.promo_enabled?'selected':''}>Activée</option><option value="false" ${!p.promo_enabled?'selected':''}>Désactivée</option></select></div><div><label>Date et heure du prochain restock</label><input type="datetime-local" data-id="${p.id}" data-f="restock_at" value="${p.restock_at?new Date(new Date(p.restock_at).getTime()-new Date(p.restock_at).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div></div><div class="actions"><button class="btn secondary" data-clear="${p.id}">Effacer le restock</button></div>`;$('products').appendChild(el);});document.querySelectorAll('#products input,#products select').forEach(el=>el.addEventListener('change',()=>{let p=data.find(x=>x.id===el.dataset.id),f=el.dataset.f,v=el.value;if(f==='stock_quantity'||f==='price'||f==='old_price')v=v===''?null:Number(v);if(f==='in_stock'||f==='promo_enabled')v=v==='true';if(f==='restock_at')v=v?new Date(v).toISOString():null;p[f]=v;if(f==='stock_quantity'&&v===0)p.in_stock=false;let status=el.closest('.product').querySelector('.status');status.textContent=p.in_stock?'EN STOCK':'RUPTURE';status.classList.toggle('off',!p.in_stock);}));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{let p=data.find(x=>x.id===b.dataset.clear);p.restock_at=null;b.closest('.product').querySelector('[data-f="restock_at"]').value='';});}
$('saveAll').onclick=async()=>{let btn=$('saveAll');btn.disabled=true;try{for(const p of data){await window.MlnPodsSync.request('products?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({name:p.name,price:p.price,old_price:p.old_price,promo_enabled:p.promo_enabled,stock_quantity:p.stock_quantity,in_stock:p.in_stock,restock_at:p.restock_at,updated_at:new Date().toISOString()})});}$('saved').textContent='✓ Modifications enregistrées et synchronisées';}catch(e){$('saved').textContent='Erreur : '+e.message;console.error(e);}finally{btn.disabled=false;}};
</script>
</body>
</html>
